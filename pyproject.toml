[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gocortex-spellbook"
dynamic = ["version"]
description = "A Python toolset for building, validating, and packaging Cortex Platform content packs."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "demisto-sdk==1.39.1",
    "gitpython>=3.1.50",
    "pyyaml>=6.0.3",
    # Pinned to the ruff version the demisto/content store pipeline uses
    # (see spellbook/assets/ruff_parity.toml); update both together.
    "ruff==0.8.0",
    # Runtime requirements: validate runs each pack's own unit tests. pytest
    # also arrives transitively via demisto-sdk, but declaring it here keeps
    # the dependency explicit. pytest-mock supplies the mocker fixture that
    # content unit tests use.
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.hatch.version]
path = "spellbook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["spellbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
